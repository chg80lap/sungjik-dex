<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>창업 7단계 암기 퀴즈</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            padding: 30px;
            text-align: center;
        }
        h1 {
            font-size: 22px;
            color: #1a1a1a;
            margin-bottom: 24px;
        }
        .card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 30px 20px;
            margin-bottom: 24px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 600;
            color: #2b3035;
            word-break: keep-all;
            line-height: 1.5;
        }
        .input-group {
            margin-bottom: 16px;
        }
        input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 2px solid #ced4da;
            border-radius: 8px;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #4c6ef5;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit {
            background: #4c6ef5;
            color: white;
        }
        .btn-submit:hover {
            background: #3b5bdb;
        }
        .btn-next {
            background: #2b8a3e;
            color: white;
        }
        .btn-next:hover {
            background: #237032;
        }
        .result {
            margin-top: 16px;
            font-weight: bold;
            font-size: 16px;
            min-height: 24px;
        }
        .correct { color: #2b8a3e; }
        .incorrect { color: #e03131; }
        .score {
            margin-top: 20px;
            font-size: 14px;
            color: #868e96;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>창업 7단계 암기 테스트</h1>
    
    <div class="card" id="question-card">
        문제를 불러오는 중...
    </div>

    <div class="input-group">
        <input type="text" id="answer-input" placeholder="숫자만 입력하세요 (예: 1)" autocomplete="off">
    </div>

    <div class="btn-group">
        <button class="btn-submit" onclick="checkAnswer()">정답 확인</button>
        <button class="btn-next" onclick="nextQuestion()">다음 문제</button>
    </div>

    <div class="result" id="result-message"></div>
    <div class="score" id="score-text">남은 문제: 7/7</div>
</div>

<script>
    const quizData = [
        { desc: "창업 예비분석", step: "1" },
        { desc: "창업 비전과 목표설정", step: "2" },
        { desc: "창업 분야 결정과 아이템 모색", step: "3" },
        { desc: "사업성분석(시장성, 경제성, 기술성 분석 등)", step: "4" },
        { desc: "인적/물적 자원의 조달과 구성", step: "5" },
        { desc: "사업 계획서 작성과 조직 구성의 설정", step: "6" },
        { desc: "창업", step: "7" }
    ];

    let currentList = [];
    let currentIndex = 0;
    let isChecked = false;

    function initQuiz() {
        // 문제 순서 섞기 (Shuffle)
        currentList = [...quizData].sort(() => Math.random() - 0.5);
        currentIndex = 0;
        showQuestion();
    }

    function showQuestion() {
        isChecked = false;
        document.getElementById('result-message').innerText = "";
        document.getElementById('answer-input').value = "";
        document.getElementById('answer-input').focus();

        if (currentIndex < currentList.length) {
            const item = currentList[currentIndex];
            document.getElementById('question-card').innerText = `"${item.desc}"`;
            document.getElementById('score-text').innerText = `진행률: ${currentIndex + 1} / ${currentList.length}`;
        } else {
            document.getElementById('question-card').innerText = "🎉 모든 문제를 다 풀었습니다!";
            document.getElementById('answer-input').style.display = "none";
            document.querySelector('.btn-submit').style.display = "none";
            document.querySelector('.btn-next').innerText = "다시 시작하기";
            document.getElementById('score-text').innerText = "";
        }
    }

    function checkAnswer() {
        if (currentIndex >= currentList.length) return;
        
        const userInput = document.getElementById('answer-input').value.trim();
        const correctAnswer = currentList[currentIndex].step;
        const resultDiv = document.getElementById('result-message');

        if (!userInput) {
            resultDiv.innerText = "답을 입력해 주세요.";
            resultDiv.className = "result incorrect";
            return;
        }

        // '1단계' 혹은 '1' 모두 정답 처리
        const cleanInput = userInput.replace(/[^0-9]/g, '');

        if (cleanInput === correctAnswer) {
            resultDiv.innerText = "⭕ 정답입니다!";
            resultDiv.className = "result correct";
        } else {
            resultDiv.innerText = `❌ 오답입니다. 정답은 ${correctAnswer}단계입니다.`;
            resultDiv.className = "result incorrect";
        }
        isChecked = true;
    }

    function nextQuestion() {
        if (currentIndex >= currentList.length) {
            document.getElementById('answer-input').style.display = "block";
            document.querySelector('.btn-submit').style.display = "block";
            document.querySelector('.btn-next').innerText = "다음 문제";
            initQuiz();
            return;
        }

        currentIndex++;
        showQuestion();
    }

    // Enter 키로 정답 확인 및 다음 문제 넘어가기
    document.getElementById('answer-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            if (!isChecked) {
                checkAnswer();
            } else {
                nextQuestion();
            }
        }
    });

    // 시작
    initQuiz();
</script>

</body>
</html>
